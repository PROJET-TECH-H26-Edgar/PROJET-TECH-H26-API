openapi: 3.0.0

info:
  title: Key Dispenser API
  version: 1.0.0

servers:
  - url: https://https://distributeurcle.edwrdledgar.me/api

paths:

  /auth/register:
    post:
      summary: Register user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastName, name, mail, password]
              properties:
                lastName:
                  type: string
                  example: Gegout
                name:
                  type: string
                  example: Edgar
                mail:
                  type: string
                  example: edgar@mail.com
                password:
                  type: string
                  example: Edgar1011
      responses:
        201:
          description: User registered

  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mail, password]
              properties:
                mail:
                  type: string
                  example: edgar@mail.com
                password:
                  type: string
                  example: Edgar1011
      responses:
        200:
          description: Login success

  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      responses:
        200:
          description: Logout success

  /key:
    get:
      summary: Get all keys
      tags: [Keys]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"

  /key/{id}:
    get:
      summary: Get key by ID
      tags: [Keys]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Key found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        404:
          description: Not found

  /key/create:
    post:
      summary: Create a new key (auto slot assign)
      tags: [Keys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, idRole, rfidUid]
              properties:
                name:
                  type: string
                  example: Clé bureau
                idRole:
                  type: integer
                  example: 1
                rfidUid:
                  type: string
                  example: 8C:76:0B:30
      responses:
        201:
          description: Key created

  /key/rfid/{rfidUid}/return:
    patch:
      summary: Detect key return via RFID
      tags: [Keys]
      parameters:
        - name: rfidUid
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Key detected

  /key/slots:
    get:
      summary: Get hardware slot status
      tags: [Keys]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Slots state
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    slot:
                      type: integer
                      example: 1
                    occupied:
                      type: boolean
                      example: true
                    keyName:
                      type: string
                      example: Clé bureau

  /borrows:
    get:
      summary: Get all borrows
      tags: [Borrows]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List borrows

    post:
      summary: Create borrow
      tags: [Borrows]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idKey]
              properties:
                idKey:
                  type: integer
      responses:
        201:
          description: Borrow created

  /borrows/{idKey}/complete:
    patch:
      summary: Complete borrow
      tags: [Borrows]
      security:
        - bearerAuth: []
      parameters:
        - name: idKey
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Borrow completed

  /roles:
    get:
      summary: Get all roles
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List roles

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    Key:
      type: object
      properties:
        idKey:
          type: integer
          example: 1
        name:
          type: string
          example: Clé bureau
        idRole:
          type: integer
          example: 1
        rfidUid:
          type: string
          example: 8C:76:0B:30
        slot:
          type: integer
          example: 2
        createAt:
          type: string
          format: date
          example: 2026-03-19
        status:
          type: string
          enum: [Libérer, Occupée, Indisponible, locked]
          example: Libérer

    Borrow:
      type: object
      properties:
        idHBorrow:
          type: integer
        keyName:
          type: string
        userName:
          type: string
        borrowTime:
          type: string
          format: date-time
        returnTime:
          type: string
          format: date-time

    Role:
      type: object
      properties:
        idRole:
          type: integer
        roleName:
          type: string