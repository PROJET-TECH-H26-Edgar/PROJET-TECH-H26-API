openapi: 3.0.0
info:
  title: Auth API
  version: 1.0.0
servers:
  - url: http://localhost:3001/api
paths:
  /auth/register:
    post:
      summary: Register user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lastName, name, mail, password]
              properties:
                lastName:
                  type: string
                  example: Gegout
                name:
                  type: string
                  example: Edgar
                mail:
                  type: string
                  example: edgar@mail.com
                password:
                  type: string
                  example: Edgar1011
      responses:
        201:
          description: User registered
  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mail, password]
              properties:
                mail:
                  type: string
                  example: edgar@mail.com
                password:
                  type: string
                  example: Edgar1011
      responses:
        200:
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
  /auth/logout:
    post:
      summary: Logout user
      tags:
        - Auth
      responses:
        200:
          description: Logout success

  /key:
    get:
      summary: Get all keys
      tags:
        - Keys
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Key"

  /key/{id}:
    get:
      summary: Get key by ID
      tags:
        - Keys
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Key found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        404:
          description: Key not found

  /key/create:
    post:
      summary: Create a new key
      tags:
        - Keys
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, idRole, rfidUid]
              properties:
                name:
                  type: string
                  example: Clé 3
                idRole:
                  type: integer
                  example: 1
                rfidUid:
                  type: string
                  example: 8C:76:0B:30
      responses:
        201:
          description: Key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Key"
        400:
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Champs manquants
                  required:
                    type: array
                    items:
                      type: string
                    example: [name, idRole, rfidUid]

  /borrows:
    get:
      summary: Get all borrows
      tags:
        - Borrows
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of borrows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Borrow"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Key:
      type: object
      properties:
        idKey:
          type: integer
          example: 1
        name:
          type: string
          example: Clé 1
        idRole:
          type: integer
          example: 1
        rfidUid:
          type: string
          example: 8C:76:0B:30
        createAt:
          type: string
          format: date
          example: 2026-03-19
        status:
          type: string
          enum: [Libérer, Occupée, Indisponible]
          example: Libérer
    Borrow:
      type: object
      properties:
        idHBorrow:
          type: integer
          example: 1
        keyName:
          type: string
          example: Clé 1
        userName:
          type: string
          example: Gegout Edgar
        borrowTime:
          type: string
          format: date-time
          example: 2026-03-19T08:00:00Z
        returnTime:
          type: string
          format: date-time
          example: 2026-03-19T17:00:00Z
